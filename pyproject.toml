[project]
name = "voxis"
dynamic = ["version"]
description = "Standalone audio transcription CLI."
readme = "README.md"
license = "MIT"
authors = [{name = "t1nkerr"}]
keywords = ["transcription", "asr", "mlx", "diarization", "cli"]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "mlx-audio>=0.4,<1",
  "numpy>=2.0,<3",
  "openai>=1.99,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
voxis = "voxis.cli:main"
voxis-bench = "voxis.bench.cli:main"

[project.urls]
Repository = "https://github.com/t1nkerr/voxis"
Issues = "https://github.com/t1nkerr/voxis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/voxis/__init__.py"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.15.10,<0.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
